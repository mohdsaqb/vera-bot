# Render blueprint. Deploy with: New > Blueprint, pointed at this repository.
#
# No Dockerfile: Render's native Python runtime installs from requirements.txt
# and runs the start command below, which is the same command used locally.
services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    # Only runtime dependencies; test tooling stays out of the image.
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # $PORT is supplied by the platform. Binding 0.0.0.0 is required for the
    # health check and for external traffic to reach the process.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    # Render polls this to decide whether a deploy is live. It is the challenge's
    # own liveness endpoint, which reads only in-memory state.
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: APP_ENV
        value: production
      # Set in the dashboard, never in this file.
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
